<script>
/* ======================= SAT Math Lib — client engine (from Test Zone v1.13) =======================
 * All interaction is local. Server calls: login, homeData, startPractice, startReview, startAssignment, getSet, getFigures, autosave,
 * submit, getResult, getReview, getFix, checkTry, askTeacher. The teacher page is TeacherPage.html (window.SMLT).
 * A set is ONE part with no time limit: no timer is ever shown; time per question is still logged.
 * State is saved to localStorage on every change and to the server every autosave_sec.
 * The server-side clock decides remaining time: remaining = limit − (serverNow − part_start).
 */
(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  function el(tag, attrs, html) {
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) { if (k === 'class') e.className = attrs[k]; else e.setAttribute(k, attrs[k]); });
    if (html !== undefined) e.innerHTML = html;
    return e;
  }
  function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  var LS = {
    get: function (k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };

  /** google.script.run as a promise */
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      r[fn].apply(r, args);
    });
  }
  /* ---- write queue (#42): a change shows on screen at once; the save runs in the background, in order, retried once.
     If it still fails, the screen is put back (job.undo) and a clear message says what was not saved. Nothing is lost while
     moving around inside the app; closing the tab with unsaved changes asks first. "Saving… / Saved ✓" bottom right. ---- */
  var WQ = { list: [], busy: false, seq: 0, idle: [] };
  function saveDot(state, msg) {
    var d = $('#wq-dot'); if (!d) { d = el('div', { id: 'wq-dot', role: 'status', 'aria-live': 'polite' }); document.body.appendChild(d); }
    d.className = state; d.textContent = msg || (state === 'busy' ? 'Saving…' : state === 'ok' ? 'Saved ✓' : 'Not saved');
    clearTimeout(WQ.hideT); if (state === 'ok') WQ.hideT = setTimeout(function () { d.className = ''; }, 1800);
  }
  /** job: {fn, args: [...], apply(), undo(), done(result), label: 'what is saved'} → returns a promise of the server result. */
  function enqueue(job) {
    job.id = ++WQ.seq;
    try { if (job.apply) job.apply(); } catch (e) { try { console.warn('apply failed', e); } catch (x) {} }
    var p = new Promise(function (ok, no) { job.ok = ok; job.no = no; });
    p.catch(function () {});
    WQ.list.push(job); WQ.failed = false; saveDot('busy'); pump();
    return p;
  }
  function pump() {
    if (WQ.busy) return;
    var job = WQ.list[0];
    if (!job) { if (!WQ.failed) saveDot('ok'); var f = WQ.idle; WQ.idle = []; f.forEach(function (fn) { try { fn(); } catch (e) {} }); return; }
    WQ.busy = true;
    var attempt = function (n) {
      (job.run ? job.run() : call.apply(null, [job.fn].concat(job.args))).then(function (r) {
        WQ.list.shift(); WQ.busy = false;
        try { if (job.done) job.done(r); } catch (e) {}
        job.ok(r); pump();
      }).catch(function (e) {
        var appMsg = /^(Error:\s*)?(LOGIN|SESSION|FORM):/.test(String((e && e.message) || e));
        if (n < 1 && !appMsg) { setTimeout(function () { attempt(n + 1); }, 1500); return; }   // retry once (network)
        WQ.list.shift(); WQ.busy = false;
        try { if (job.undo) job.undo(); } catch (x) {}
        WQ.failed = true; saveDot('fail', 'Not saved'); $('#toast').classList.remove('on');
        modal('Not saved', esc((job.label ? job.label + ': ' : '') + errMsg(e)) + '<br><br>The screen shows it as it was before. Try again.', [{ label: 'OK', value: 1 }]);
        job.no(e); pump();
      });
    };
    attempt(0);
  }
  /** Run fn when nothing is waiting to be saved (at once if the queue is empty). */
  function whenSaved(fn) { if (!WQ.list.length && !WQ.busy) fn(); else WQ.idle.push(fn); }
  window.addEventListener('beforeunload', function (e) { if (WQ.list.length) { e.preventDefault(); e.returnValue = 'Some changes are still being saved.'; return e.returnValue; } });

  /** Text for the student: only the app's own English messages ("LOGIN: …", "SESSION: …", "FORM: …"). Anything else
   *  (network / library / browser text, often in the browser's language) → one plain English line (#16 m3). */
  var NET_MSG = 'Could not reach the server. Check your internet connection and try again.';
  function errMsg(e) {
    var m = String((e && e.message) || e || '').replace(/^(Error|Exception):\s*/, '');
    try { console.warn('server call failed: ' + m); } catch (x) {}
    var k = /^(LOGIN|SESSION|FORM):\s*/.exec(m);
    return k ? m.slice(k[0].length) : NET_MSG;
  }
  /** A random id for this browser (login lock-out counts wrong codes per device; #16 m8). */
  function deviceId() {
    var d = LS.get('tz_dev');
    if (!d) { d = 'D' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); LS.set('tz_dev', d); }
    return d;
  }

  /* ---------------- app state ---------------- */
  var A = {
    student: null, code: '', test: null, profile: null, parts: {}, qs: {}, st: null,
    events: [], evBase: 0, acked: 0, offset: 0, tick: null, saveIv: null, saving: false, ending: false,
    calc: null, calcSci: null, desmosLoading: null, annotMode: false, lastSel: null, hlActive: null
  };
  window.TZ = A; window.SML = A; // for the test harness / debugging

  function serverNow() { return Date.now() + A.offset; }
  function lsKey() { return 'tz_s_' + A.test.session.session_id; }
  function curPart() { return A.st ? A.st.current_part : null; }
  function pdef(p) { return A.parts[p || curPart()]; }
  function pst(p) { return A.st.parts[p || curPart()]; }
  function qlist(p) { return A.qs[p || curPart()] || []; }
  function word() { return (A.profile && A.profile.part_word) || 'set'; }
  function untimed() { var d = A.parts && A.parts[curPart()]; return !!(A.profile && A.profile.untimed) || !!(d && !Number(d.time_limit_sec)); }

  /* ---------------- screens ---------------- */
  function show(id) {
    $$('.screen').forEach(function (s) { s.classList.toggle('on', s.id === id); });
    if (id === 'scr-home') navSet('home'); else if (id === 'scr-result') navSet('result');
    else if (id === 'scr-test') navSet($('#scr-test').classList.contains('viewing') ? 'view' : 'set');
  }

  /* ---------------- #43 browser Back / phone back gesture / Backspace ----------------
     Every app screen is one #hash entry (home · set · result · view · t-<teacher screen>). Back (button, gesture, Alt+←)
     never leaves the app: it goes up one level — a question viewer → its result → home; inside a set or test it asks first
     ("Save and leave?"); on the home page it stays. Backspace only deletes text in a text box. */
  var NAV = { cur: '', busy: false };
  function navSet(h) {
    if (!h || NAV.cur === h) return;
    NAV.cur = h;
    try { if (location.hash.slice(1) !== h) location.hash = h; } catch (e) {}
  }
  function navAgain() { var h = NAV.cur; NAV.cur = ''; navSet(h); }          // undo a Back: the same screen stays
  function onHash() {
    var h = location.hash.slice(1);
    if (h === NAV.cur || !NAV.cur) return;                              // our own change (or signed out)
    navUp();
  }
  function navUp() {
    var on = ($$('.screen.on')[0] || {}).id;
    if ($('#modal-root').classList.contains('on') || NAV.busy) { navAgain(); return; }
    if (on === 'scr-test' && (A.view || A.goPend)) { exitViewer(); return; }
    if (on === 'scr-test') { navAgain(); askExit(); return; }
    if (on === 'scr-result') { var b = $('#res-home'); if (b) { NAV.cur = ''; b.click(); } else navAgain(); return; }
    if (on === 'scr-teacher') { if (window.SMLT && window.SMLT.back && window.SMLT.back()) return; navAgain(); return; }
    navAgain();                                                          // home / sign-in: stay in the app
  }
  function isTyping(t) { return t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable); }
  function initNav() {
    window.addEventListener('hashchange', onHash);
    document.addEventListener('keydown', function (e) {
      if ((e.key === 'Backspace' || e.keyCode === 8) && !isTyping(e.target)) e.preventDefault();   // never "go back a page"
    }, true);
  }
  /** Exit / Home inside a set, a test or Fix: always asks first; the work is saved (it is anyway) and home opens at once. */
  function askExit() {
    if (NAV.busy) return;
    NAV.busy = true;
    var inSet = !A.view && A.st && A.st.phase !== 'submitting';
    modal(inSet ? 'Save and leave?' : 'Leave?', inSet ? 'You can continue later from your home page. Everything you did is saved.' : 'Your fixes are saved. You can come back to them from your home page.',
      [{ label: 'Keep working', value: false, cls: 'btn-outline' }, { label: inSet ? 'Save and leave' : 'Leave', value: true }]).then(function (ok) {
      NAV.busy = false;
      if (!ok) return;
      if (A.view) { if (VW && VW.go) exitViewer(); else exitViewerHome(); return; }
      saveLater();
    });
  }
  function view(id) {
    $$('#tmain .view').forEach(function (v) { v.classList.toggle('on', v.id === id); });
    var inQ = id === 'v-question', inR = id === 'v-review', inTest = inQ || inR;
    $('#btn-nav').parentNode.style.visibility = inQ ? 'visible' : 'hidden';
    $('#btn-back').classList.toggle('hidden', !inTest);
    $('#btn-next').classList.toggle('hidden', !inTest);
    var d = pdef();
    $('#tool-annot').classList.toggle('hidden', !(inQ && d && d.annotate !== false));
    $('#tool-more').classList.toggle('hidden', !inTest);
    $('#practice-banner').classList.toggle('on', !!(inTest && A.profile && A.profile.practice_banner));
    $('#tool-calc').classList.toggle('hidden', !(inTest && d && d.calculator));
    $('#tool-ref').classList.toggle('hidden', !(inTest && d && d.reference));
    $('#btn-dir').classList.toggle('hidden', !inTest);
    $('#timer').style.visibility = (id === 'v-break' || untimed()) ? 'hidden' : ''; // no clock on the break screen / in an untimed set
    if (!inTest) { closePops(); hideCalc(true); $('#ref-panel').classList.remove('on'); }
    if (!inQ) hideHlToolbar();
  }
  function toast(msg, ms) {
    var t = $('#toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('on'); }, ms || 2600);
  }
  function modal(title, bodyHtml, buttons) {
    return new Promise(function (resolve) {
      var root = $('#modal-root');
      root.innerHTML = '';
      var m = el('div', { class: 'modal', role: 'dialog' }, '<h3>' + esc(title) + '</h3><div class="body">' + bodyHtml + '</div>');
      var b = el('div', { class: 'btns' });
      buttons.forEach(function (bt) {
        var x = el('button', { class: bt.cls || 'btn-blue', type: 'button' }, esc(bt.label));
        x.onclick = function () { root.classList.remove('on'); root.innerHTML = ''; resolve(bt.value); };
        b.appendChild(x);
      });
      m.appendChild(b); root.appendChild(m); root.classList.add('on');
    });
  }
  function setSaveDot(t) { $('#save-dot').textContent = t || ''; }

  /* ---------------- device ---------------- */
  function deviceStr() {
    var ua = navigator.userAgent || '';
    var os = /iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? 'iPad' : /iPhone/.test(ua) ? 'iPhone' :
             /Android/.test(ua) ? 'Android' : /Mac/.test(ua) ? 'Mac' : /Windows/.test(ua) ? 'Windows' : /CrOS/.test(ua) ? 'Chromebook' : /Linux/.test(ua) ? 'Linux' : 'Other';
    var br = /Edg\//.test(ua) ? 'Edge' : /(Chrome|CriOS)\//.test(ua) ? 'Chrome' : /(Firefox|FxiOS)\//.test(ua) ? 'Firefox' : /Safari\//.test(ua) ? 'Safari' : 'Browser';
    return os + ' ' + br + ' ' + window.innerWidth + 'x' + window.innerHeight;
  }

  /* ================= login / home ================= */
  function initLogin() {
    $('#login-form').addEventListener('submit', function (e) { e.preventDefault(); doLogin($('#login-code').value, false); });
    var out = function () { LS.del('tz_code'); LS.del('tz_active'); A.student = null; A.teacher = false; A.code = null; $('#login-code').value = ''; $('#login-err').textContent = ''; show('scr-login'); };
    $('#btn-logout').onclick = out; $('#t-logout').onclick = out;
    var saved = LS.get('tz_code');
    if (saved) {
      // #42: signed in on this device → the last home page shows at once while the server checks the code
      var hc = LS.get('sml_home');
      if (hc && hc.code === String(saved).toUpperCase() && hc.home && !LS.get('tz_active')) {
        A.student = { code: hc.code, name: hc.name }; A.code = hc.code; A.home = hc.home; A.home._code = hc.code; A.homeAt = 0; showHome(true);
      }
      doLogin(saved, true);
    }
  }
  function doLogin(code, auto) {
    code = String(code || '').trim().toUpperCase();
    if (!code) { $('#login-err').textContent = 'Enter your code.'; return; }
    $('#login-btn').disabled = true; $('#login-err').textContent = auto ? 'Signing in…' : '';
    if (!auto) $('#login-btn').textContent = 'Signing in…';
    call('login', code, deviceId(), true).then(function (r) {
      $('#login-btn').disabled = false; $('#login-btn').textContent = 'Sign In';
      if (!r.ok) { $('#login-err').textContent = r.msg; LS.del('tz_code'); LS.del('sml_home'); A.student = null; A.home = null; show('scr-login'); return; }
      if (r.teacher) { // teacher mode: the code is never stored on the device
        LS.del('tz_code'); LS.del('tz_active'); A.teacher = true; A.code = code; A.student = { name: 'Teacher', code: code };
        $$('.app-name').forEach(function (x) { x.textContent = r.app_name || 'SAT Math Lib'; });
        showTeacher(); return;
      }
      A.teacher = false;
      A.student = r.student; A.code = r.student.code;
      LS.set('tz_code', A.code);
      $$('.app-name').forEach(function (x) { x.textContent = r.app_name || 'SAT Math Lib'; });
      document.title = r.app_name || 'SAT Math Lib';
      var act = LS.get('tz_active');
      if (act && act.code === A.code && act.session_id) { openTest(act.session_id, {}); return; }
      if (r.home) { r.home._code = A.code; A.home = r.home; A.homeAt = Date.now(); LS.set('sml_home', { code: A.code, name: A.student.name, home: r.home }); }
      if ($('#scr-home').classList.contains('on') && A.home) renderHomeQuiet(A.home); else showHome();
    }).catch(function (e) {
      $('#login-btn').disabled = false; $('#login-btn').textContent = 'Sign In';
      if (A.student && $('#scr-home').classList.contains('on')) { setTimeout(function () { doLogin(code, true); }, 10000); return; }   // home from the device stays
      $('#login-code').value = code;
      $('#login-err').textContent = 'No connection. Signing in again automatically when the internet is back…';
      clearTimeout(A.reloginT);
      var retry = function () { if (!A.student) doLogin(code, true); };
      A.reloginT = setTimeout(retry, 10000);
      window.addEventListener('online', retry, { once: true });
    });
  }
  function showHome(skipFetch) {
    A.profile = null; stopLoops(); clearTimeout(A.subT); // nothing of a set runs behind the home
    A.pl = false; $('#scr-test').classList.remove('placement');
    show('scr-home');
    $('#home-name').textContent = A.student.name;
    var have = A.home && A.home._code === A.code ? A.home : null;
    if (have) renderHome(have);
    else { $('#home-hello').textContent = ''; $('#home-list').innerHTML = '<div class="spinner"></div><p class="lead" style="text-align:center">Loading your page…</p>'; }
    if (have && Date.now() - (A.homeAt || 0) < 3000) return;            // just loaded with the sign-in
    if (skipFetch === true) return;
    var nav = A.homeNav = (A.homeNav || 0) + 1;
    call('homeData', A.code).then(function (r) {
      if (nav !== A.homeNav) return;                                  // a set was opened meanwhile: this page is already old
      r._code = A.code; A.homeAt = Date.now();
      var same = have && JSON.stringify(have) === JSON.stringify(r);
      A.home = r; LS.set('sml_home', { code: A.code, name: A.student.name, home: r });
      if (!same && nav === A.homeNav) renderHomeQuiet(r);
    }).catch(function (e) { if (!have) $('#home-list').innerHTML = '<div class="empty">Could not load your page: ' + esc(errMsg(e)) + ' <br><br><button class="btn-outline" onclick="location.reload()">Reload</button></div>'; });
  }
  /** A newer home page: drawn again only while the student is on it and not typing / in a dialog. */
  function renderHomeQuiet(r) {
    if (!$('#scr-home').classList.contains('on') || $('#modal-root').classList.contains('on')) return;
    var a = document.activeElement; if (a && /^(INPUT|TEXTAREA)$/.test(a.tagName)) return;
    var y = window.scrollY; renderHome(r); window.scrollTo(0, y);
  }
  /** Assigned focus card (mockup B approved by Minh 14 Nov 21:09, without the "Desmos + reference sheet" line). */
  /** #48 "2 min 10 s" */
  function durStr(sec) { sec = Math.round(Number(sec) || 0); var m = Math.floor(sec / 60), x = sec % 60; return m ? m + ' min' + (x ? ' ' + x + ' s' : '') : x + ' s'; }
  function awayLine(n, sec, at) { return n ? 'Left the window: ' + n + '× · ' + durStr(sec) + (at ? ' · at ' + at : '') : 'Left the window: never'; }
  function focusCard(a) {
    var c = el('article', { class: 'hz-focus', id: a.placement ? 'placement-card' : 'assigned' });
    var diffs = (a.diffs || '').split(',').filter(String).map(function (d) { return { E: 'Easy', M: 'Medium', H: 'Hard' }[d]; });
    var facts = a.placement ? ['<b>One</b> question at a time', 'No timer', 'Take your time']
      : [(diffs.length ? '<b>' + diffs.join(' + ') + '</b> questions' : '<b>' + a.n + '</b> questions'), 'No timer pressure'];
    var sub = a.placement ? 'About 15–24 questions, one at a time · no timer' : ((a.skills || []).join(' · ') + (a.more_skills ? ' + ' + a.more_skills + ' more' : ''));
    var due = a.due ? 'due ' + esc(a.due) : '';
    var ring = a.placement ? (a.set_id ? '<div>' + (a.answered || 0) + '<small>answered</small></div>' : '<div>15–24<small>questions</small></div>')
      : (a.set_id && a.answered ? '<div>' + a.answered + '/' + a.n + '<small>done</small></div>' : '<div>' + a.n + '<small>questions</small></div>');
    c.innerHTML = '<div><p class="hz-eyebrow">Assigned by your teacher</p><h1>' + esc(a.title) + '</h1>' +
      '<p class="hz-of">' + esc(sub) + (sub && due ? ' · ' : '') + due + '</p>' +
      '<ul class="hz-facts">' + facts.map(function (f) { return '<li>' + f + '</li>'; }).join('') + '</ul></div>' +
      '<div class="hz-ring' + (a.set_id ? ' prog' : '') + '"' + (a.set_id && a.n ? ' style="--p:' + Math.round(100 * (a.answered || 0) / a.n) + '"' : '') + '>' + ring + '</div>';
    var b = el('button', { class: 'hz-btn big', type: 'button' }, a.set_id ? 'Continue' : 'Start');
    b.onclick = function () { startAsg(a, b); };
    c.appendChild(b);
    return c;
  }
  function startAsg(a, b) {
    if (a.set_id) { openTest(a.set_id, {}); return; }
    var undo = busyBtn(b, 'Opening…');
    call('startAssignment', A.code, a.assignment_id, { device: deviceStr() }).then(function (r) {
      // the cached home (whatever copy is current) knows at once that this assignment is started
      [a].concat(((A.home || {}).assignments || []).filter(function (x) { return x.assignment_id === a.assignment_id; })).forEach(function (x) { x.set_id = r.set_id; x.answered = x.answered || 0; });
      openTest(r.set_id, {}, r.set);
    })
      .catch(function (e) { undo(); modal('Could not start', esc(errMsg(e)), [{ label: 'OK', value: 1 }]); });
  }
  function renderHome(r) {
    {
      var box = $('#home-list'); box.innerHTML = '';
      $('#home-hello').textContent = 'Hi ' + (r.first_name || A.student.name || '') + '. ' + ((r.assignments || []).length ? 'Here is your homework.' : 'What do you want to practise?');
      // #43 order (Minh 14 Nov): ① Assigned (focus card of mockup B, Pick up beside it) ② Practise by skill ③ Mixed Practice
      // ④ Review ⑤ History
      var asgs = r.assignments || [], top = el('section', { class: 'hz-next', id: 'assigned-row' });
      if (asgs.length) top.appendChild(focusCard(asgs[0]));
      else top.appendChild(el('article', { class: 'hz-focus none', id: 'assigned' }, '<div><p class="hz-eyebrow">Assigned by your teacher</p><p class="sm-empty">No assignment right now.</p></div>'));
      var side = el('div', { class: 'hz-side', id: 'pickup' });
      if (asgs.length > 1) {
        side.appendChild(el('p', { class: 'hz-label' }, 'Also assigned'));
        asgs.slice(1).forEach(function (a) {
          var row = el('div', { class: 'hz-resume sm-asg2' });
          row.innerHTML = '<div><b>' + esc(a.title) + '</b><span>' + (a.placement ? 'Placement test · one at a time' : a.n + ' questions') + (a.due ? ' · due ' + esc(a.due) : '') + '</span></div>';
          var b2 = el('button', { class: 'hz-btn ghost', type: 'button' }, a.set_id ? 'Continue' : 'Start'); b2.onclick = function () { startAsg(a, b2); };
          row.appendChild(b2); side.appendChild(row);
        });
      }
      if (r.open && r.open.length) {
        side.appendChild(el('p', { class: 'hz-label' + (asgs.length > 1 ? ' sp' : '') }, 'Pick up where you stopped'));
        r.open.forEach(function (o) {
          var row = el('div', { class: 'hz-resume' });
          row.innerHTML = '<div><b>' + esc(o.title) + '</b><span>Started ' + esc(o.started) + '</span></div>';
          var b = el('button', { class: 'hz-btn ghost', type: 'button' }, 'Continue'); b.onclick = function () { openTest(o.set_id, {}); };
          row.appendChild(b);
          row.appendChild(el('div', { class: 'hz-prog' }, '<i style="width:' + (o.n ? Math.round(100 * o.answered / o.n) : 0) + '%"></i>'));
          row.appendChild(el('span', { class: 'w' }, o.answered + '/' + o.n + ' answered'));
          side.appendChild(row);
        });
      }
      if (side.firstChild) top.appendChild(side); else top.classList.add('solo');
      box.appendChild(top);
      box.appendChild(el('h2', { class: 'hz-h2' }, 'Practise by skill'));
      box.appendChild(skillPicker(r));
      box.appendChild(mixedCard(r));
      // ④ Review: questions missed or slow, until one clean try
      var rv = el('section', { class: 'sm-revcard', id: 'review-card' });
      var nr = (r.review && r.review.open) || 0;

  /** Show whatever the state says we are on. */

  /* ---------- floating panels (drag + resize, mouse + touch) ---------- */
  /* ---------- floating panels (calculator, reference) ----------
     Why the calculator "jumped" (Minh, 13 Nov): the old code added pointermove listeners on every pointerdown and removed them
     only on pointerup. A pointercancel / lost capture (trackpad gesture, button released outside the frame) left them attached,
     so merely hovering over the title bar or the corner kept moving / resizing the panel, and the next drag added a SECOND
     listener with an old starting point — two listeners fought and the size jumped back and forth. Expand also kept a stale
     "old size" and the question re-docked whenever the panel crossed x = 120 on a drag.
     Now: one gesture at a time (ends on pointerup / pointercancel / lostpointercapture / a mouse move with no button), drag only
     by the title bar, resize only from the corner, Expand/Collapse = two fixed sizes, the panel never resizes itself (a window
     resize only keeps it inside the window), size + position remembered for the session. Phone: a bottom sheet. */
  var PHONE_W = 700;
  function viewW() { return document.documentElement.clientWidth || window.innerWidth; }
  function isPhone() { return viewW() < PHONE_W; }
  function hostRect() { var t = $('#tmain'); return { top: t.offsetTop, h: t.clientHeight, w: viewW() }; }
  function fpLoad(panel) { try { return JSON.parse(sessionStorage.getItem('sml_fp_' + panel.id) || 'null'); } catch (e) { return null; } }
  function fpSave(panel) { try { sessionStorage.setItem('sml_fp_' + panel.id, JSON.stringify({ box: panel._box, big: !!panel._big })); } catch (e) {} }
  function fpBig() { var H = hostRect(); return { x: 8, y: H.top + 8, w: Math.min(H.w - 16, Math.max(640, Math.round(H.w * 0.6))), h: Math.max(260, H.h - 16) }; }
  /** Puts the panel where its state says, kept inside the window. Never changes the saved size unless it no longer fits. */
  function fpApply(panel) {
    var H = hostRect(), st = panel.style;
    panel.classList.toggle('big', !!panel._big);
    if (isPhone()) {
      panel.classList.add('sheet');
      var hh = panel._big ? H.h : Math.round(H.h * 0.62);
      st.left = '0px'; st.right = '0px'; st.width = 'auto'; st.height = hh + 'px'; st.top = (H.top + H.h - hh) + 'px';
      return;
    }
    panel.classList.remove('sheet');
    var b = panel._big ? fpBig() : panel._box;
    if (!panel._big) {
      b.w = Math.max(320, Math.min(b.w, H.w - 16)); b.h = Math.max(260, Math.min(b.h, H.h - 8));
      b.x = Math.max(8, Math.min(b.x, H.w - b.w - 8)); b.y = Math.max(H.top + 4, Math.min(b.y, H.top + H.h - b.h - 4));
    }
    st.left = Math.round(b.x) + 'px'; st.top = Math.round(b.y) + 'px'; st.right = 'auto';
    st.width = Math.round(b.w) + 'px'; st.height = Math.round(b.h) + 'px';
  }
  /** One pointer gesture on el: start() → move(dx, dy) … → end(). Always cleaned up, whatever ends it. */
  function fpGesture(el, can, start, move, end) {
    el.addEventListener('pointerdown', function (e) {
      if ((e.pointerType === 'mouse' && e.button !== 0) || e.target.closest('button') || !can() || el._gesture) return;
      e.preventDefault();
      var id = e.pointerId, sx = e.clientX, sy = e.clientY, raf = 0, last = null;
      el._gesture = true;
      try { el.setPointerCapture(id); } catch (x) {}
      start();
      var mv = function (ev) {
        if (ev.pointerId !== id) return;
        if (ev.pointerType === 'mouse' && ev.buttons === 0) { stop(); return; } // the button was released where we could not see it
        last = [ev.clientX - sx, ev.clientY - sy];
        if (!raf) raf = requestAnimationFrame(function () { raf = 0; if (last) move(last[0], last[1]); });
      };
      var stop = function () {
        if (!el._gesture) return;
        el._gesture = false;
        el.removeEventListener('pointermove', mv);
        ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (t) { el.removeEventListener(t, stop); });
        try { el.releasePointerCapture(id); } catch (x) {}
        if (raf) { cancelAnimationFrame(raf); raf = 0; if (last) move(last[0], last[1]); }
        end();
      };
      el.addEventListener('pointermove', mv);
      ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (t) { el.addEventListener(t, stop); });
    });
  }
  /** Drag by the title bar, resize from the corner (laptop only; not while expanded). opts: def() = first box, onChange(final). */
  function makeFloating(panel, head, handle, opts) {
    opts = opts || {};
    var saved = fpLoad(panel);
    panel._big = !!(saved && saved.big);
    panel._box = saved && saved.box ? saved.box : null;
    panel._def = opts.def;
    var can = function () { return !isPhone() && !panel._big; }, b0 = null;
    var done = function () { fpSave(panel); if (opts.onChange) opts.onChange(true); };
    fpGesture(head, can, function () { b0 = JSON.parse(JSON.stringify(panel._box)); },
      function (dx, dy) { panel._box.x = b0.x + dx; panel._box.y = b0.y + dy; fpApply(panel); }, done);
    fpGesture(handle, can, function () { b0 = JSON.parse(JSON.stringify(panel._box)); },
      function (dx, dy) { panel._box.w = b0.w + dx; panel._box.h = b0.h + dy; fpApply(panel); if (opts.onChange) opts.onChange(false); }, done);
  }
  function fpOpen(panel) {

  }
  function fpToggleBig(panel) { panel._big = !panel._big; fpApply(panel); fpSave(panel); }

  /* ---------- reference sheet (SAT-ready) ---------- */
  // #47: the server says 'sat_math' (sets, viewer) — 'sat' came from Test Zone. Both = the SAT Math reference sheet. Every
  // part of this app is SAT Math, so a part with reference: true and no own sheet also gets it.
  var REF_SAT_NAMES = { sat: 1, sat_math: 1 };
  function refHtml() {
    var p = A.profile || {};
    if (REF_SAT_NAMES[String(p.reference_sheet || '').toLowerCase()] || !p.reference_html) return SAT_REF_HTML;
    return p.reference_html;
  }
  function initRef() {
    var panel = $('#ref-panel');
    makeFloating(panel, $('#ref-head'), $('#ref-rs'), { def: function () {
      var H = hostRect(), w = Math.round(Math.max(340, Math.min(520, H.w * 0.4)));
      return { x: H.w - w - 16, y: H.top + 8, w: w, h: Math.max(320, Math.min(680, H.h - 16)) };
    } });
    $('#tool-ref').onclick = function () {
      var on = !panel.classList.contains('on');
      if (on) fpOpen(panel); else panel.classList.remove('on');
      $('#tool-ref').classList.toggle('active', on);
      if (on) { $('#ref-body').innerHTML = refHtml(); typeset($('#ref-body')); }
    };
    $('#ref-x').onclick = function () { panel.classList.remove('on'); $('#tool-ref').classList.remove('active'); };
  }

  /* ---------- annotate (highlights + notes, stored as text offsets) ---------- */
  /** Highlightable text of a question: 's' = question text (stem + figures), 'p' = passage pane (SAT Reading and Writing). */
  function textRoot(qid, r) { var b = qBox(qid); return b ? (r === 'p' ? $('.q-text-pass', b) : $('.q-text', b)) : null; }
  function textNodes(root) {
    var out = [];
    var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: function (n) {
        var p = n.parentNode;
        while (p && p !== root) { if (p.nodeName === 'MJX-CONTAINER' || p.nodeName === 'SCRIPT' || p.nodeName === 'STYLE') return NodeFilter.FILTER_REJECT; p = p.parentNode; }
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    while (w.nextNode()) out.push(w.currentNode);
    return out;
  }
  /** Character offset of a DOM boundary point within the highlightable text of root (math is skipped → snaps). */
  function offsetOf(root, node, off) {
    var nodes = textNodes(root), acc = 0;
    var r = document.createRange(); r.setStart(node, off); r.collapse(true);
    for (var j = 0; j < nodes.length; j++) {
      var n = nodes[j];
      if (n === node) return acc + off;
      if (r.comparePoint(n, n.data.length) <= 0) acc += n.data.length; else return acc;
    }
    return acc;
  }
  function selectionOffsets() {
    var sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) return null;
    var q = curQ(); if (!q) return null;
    var r = sel.getRangeAt(0), which = null, root = null;
    ['s', 'p'].forEach(function (k) { var x = textRoot(q.qid, k); if (!which && x && x.contains(r.commonAncestorContainer)) { which = k; root = x; } });
    if (!root) return null;
    var s = offsetOf(root, r.startContainer, r.startOffset), e = offsetOf(root, r.endContainer, r.endOffset);
    if (e - s < 1) return null;
    return { qid: q.qid, s: s, e: e, r: which };
  }
  function unwrapHighlights(root) {
    $$('span.hl', root).forEach(function (sp) { var p = sp.parentNode; while (sp.firstChild) p.insertBefore(sp.firstChild, sp); p.removeChild(sp); });
    root.normalize();
  }
  function applyHighlights(qid) { ['s', 'p'].forEach(function (k) { applyHighlightsIn(qid, k); }); }
  function applyHighlightsIn(qid, which) {
    var root = textRoot(qid, which); if (!root) return;
    unwrapHighlights(root);
    var list = (pst().hl[qid] || []).filter(function (h) { return (h.r || 's') === which; }).sort(function (a, b) { return a.s - b.s; });
    list.forEach(function (h) {
      var nodes = textNodes(root), acc = 0, segs = [];
      nodes.forEach(function (n) {
        var a = acc, b = acc + n.data.length; acc = b;
        var s = Math.max(h.s, a), e = Math.min(h.e, b);
        if (e > s) segs.push({ n: n, s: s - a, e: e - a });
      });
      segs.forEach(function (sg) {
        if (!sg.n.data.slice(sg.s, sg.e).trim()) return;
        var mid = sg.n.splitText(sg.s); mid.splitText(sg.e - sg.s);
        var sp = document.createElement('span');
        sp.className = 'hl ' + (h.c === 'u' ? 'hl-u' : 'hl-' + h.c) + (h.note ? ' hl-note' : '');
        sp.setAttribute('data-hid', h.id);
        mid.parentNode.insertBefore(sp, mid); sp.appendChild(mid);
        sp.onclick = function (ev) { ev.stopPropagation(); openHlToolbar(qid, h.id, sp); };
      });
    });
  }
  function addHighlight(o, c, noToolbar) {
    var ps = pst(), list = ps.hl[o.qid] || [];
    var h = { id: 'h' + Date.now().toString(36), s: o.s, e: o.e, c: c || 'y', note: '' };
    if (o.r === 'p') h.r = 'p';
    ps.hl[o.qid] = list.concat([h]);
    log('annotate', o.qid, 'add:' + (o.r === 'p' ? 'p' : '') + o.s + '-' + o.e);
    persist();
    try { window.getSelection().removeAllRanges(); } catch (e) {}
    applyHighlights(o.qid);
    var sp = $('span.hl[data-hid="' + h.id + '"]', qBox(o.qid));
    if (sp && !noToolbar) openHlToolbar(o.qid, h.id, sp);
    return h;
  }
  /* #36 (v1.13) Bluebook-style: select text → a small toolbar right below the selection (yellow, blue, pink, underline,
     note; trash when the selection is inside a highlight). One click applies and closes; click elsewhere / Esc closes. */
  function annotAllowed() { var b = $('#tool-annot'); return !!(A.st && A.st.phase === 'test' && b && !b.classList.contains('hidden') && $('#scr-test').classList.contains('on')); }
  function showSelToolbar() {
    if (A.annotMode || !annotAllowed()) return;
    var sel = window.getSelection(); if (!sel || sel.isCollapsed || !sel.rangeCount) return;
    var o = selectionOffsets(); if (!o) return;
    var inside = (pst().hl[o.qid] || []).filter(function (h) { return (h.r || 's') === o.r && h.s <= o.s && o.e <= h.e; }).pop();
    var rects = sel.getRangeAt(0).getClientRects();
    if (!rects.length) return;
    if (inside) { A.hlActive = { qid: o.qid, id: inside.id }; A.hlPending = null; markToolbar(inside); }
    else { A.hlActive = null; A.hlPending = o; markToolbar({}); }
    var n = $('#hl-note'); n.value = inside ? inside.note || '' : ''; n.classList.toggle('hidden', !(inside && inside.note));
    $('#hl-del').classList.toggle('hidden', !inside);
    placeToolbarRects(rects);
  }
  /** below the last line of the selection (above the first line when there is no room), inside the screen */
  function placeToolbarRects(rects) {
    var tb = $('#hl-toolbar'), host = $('#scr-test').getBoundingClientRect();
    var first = rects[0], last = rects[rects.length - 1], gap = A.touch ? 26 : 8; // touch: room for the selection handles
    tb.classList.add('on');
    var w = tb.offsetWidth, h = tb.offsetHeight;
    var left = Math.max(8, Math.min(host.width - w - 8, last.left - host.left));
    var top = last.bottom - host.top + gap;
    if (top + h > host.height - 70) top = first.top - host.top - h - gap;
    top = Math.max(8, top);
    tb.style.left = left + 'px'; tb.style.top = top + 'px';
  }
  function hlApply(c) {
    if (A.hlPending) { var o = A.hlPending; A.hlPending = null; addHighlight(o, c, true); hideHlToolbar(); return; }
    if (A.hlActive) { updateHl({ c: c }); hideHlToolbar(); }
  }
  function initAnnotate() {
    document.addEventListener('selectionchange', function () {
      if (!A.st || A.st.phase !== 'test') return;
      var o = selectionOffsets(); if (o) A.lastSel = { o: o, t: Date.now() };
    });
    var maybeAuto = function () { if (!A.annotMode) return; setTimeout(function () { var o = selectionOffsets(); if (o) addHighlight(o); }, 30); };
    document.addEventListener('mouseup', maybeAuto);
    document.addEventListener('touchend', maybeAuto);
    // #36: the toolbar at the selection — mouse / trackpad (mouseup), touch (after the handles settle), keyboard (Shift + arrows)
    document.addEventListener('pointerdown', function (e) { A.ptrDown = true; A.touch = e.pointerType === 'touch' || e.pointerType === 'pen'; }, true);
    document.addEventListener('pointerup', function () { A.ptrDown = false; }, true);
    document.addEventListener('mouseup', function (e) { if (!e.target.closest('#hl-toolbar')) setTimeout(showSelToolbar, 10); });
    document.addEventListener('keyup', function (e) { if (e.shiftKey || /^Arrow|Shift/.test(e.key)) setTimeout(showSelToolbar, 10); });
    document.addEventListener('selectionchange', function () {
      clearTimeout(A.selT);
      if (!A.touch) return;
      A.selT = setTimeout(function () { if (!A.ptrDown) showSelToolbar(); }, 450);
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && $('#hl-toolbar').classList.contains('on')) { hideHlToolbar(); } });
    document.addEventListener('scroll', function (e) { if (A.hlPending && !(e.target.closest && e.target.closest('#hl-toolbar'))) hideHlToolbar(); }, true);
    $('#tool-annot').onclick = function () {
      var o = selectionOffsets() || (A.lastSel && Date.now() - A.lastSel.t < 8000 && curQ() && A.lastSel.o.qid === curQ().qid ? A.lastSel.o : null);
      A.lastSel = null;
      if (o) { addHighlight(o); return; }
      A.annotMode = !A.annotMode;
      $('#tool-annot').classList.toggle('active', A.annotMode);
      var nm = (A.profile && A.profile.annotate_label) || 'Annotate';
      toast(A.annotMode ? nm + ' is on: select words in the text or question to highlight them.' : nm + ' is off.');
    };
    var tb = $('#hl-toolbar');
    $$('[data-c]', tb).forEach(function (b) {
      b.addEventListener('mousedown', function (e) { e.preventDefault(); }); // keep the selection while clicking
      b.onclick = function () { hlApply(b.getAttribute('data-c')); };
    });
    $('#hl-del').onclick = function () {
      var a = A.hlActive; if (!a) return;
      pst().hl[a.qid] = (pst().hl[a.qid] || []).filter(function (h) { return h.id !== a.id; });
      log('annotate', a.qid, 'delete'); persist(); applyHighlights(a.qid); hideHlToolbar();
    };
    $('#hl-close').onclick = hideHlToolbar;
    $('#hl-note-btn').onclick = function () {
      if (A.hlPending) { // a new selection: highlight it (yellow) and open the note box
        var o = A.hlPending; A.hlPending = null;
        var h = addHighlight(o, 'y', true), sp = $('span.hl[data-hid="' + h.id + '"]', qBox(o.qid));
        if (sp) openHlToolbar(o.qid, h.id, sp);
      }
      var n = $('#hl-note'); n.classList.toggle('hidden'); if (!n.classList.contains('hidden')) n.focus();
    };
    $('#hl-note').addEventListener('input', function () { updateHl({ note: $('#hl-note').value }, true); });
  }
  function findHl(qid, id) { return (pst().hl[qid] || []).filter(function (h) { return h.id === id; })[0]; }
  function updateHl(ch, quiet) {
    var a = A.hlActive; if (!a) return;
    var h = findHl(a.qid, a.id); if (!h) return;
    Object.keys(ch).forEach(function (k) { h[k] = ch[k]; });
    if (!quiet) log('annotate', a.qid, ch.c ? 'color:' + ch.c : 'note');
    persist();
    if (!quiet || ch.note !== undefined) {
      applyHighlights(a.qid);
      var sp = $('span.hl[data-hid="' + a.id + '"]', qBox(a.qid));
      markToolbar(h);
      if (sp && !quiet) placeToolbar(sp);
    }
  }
  function markToolbar(h) { $$('#hl-toolbar [data-c]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-c') === h.c); }); }
  function placeToolbar(sp) {
    var rs = sp.getClientRects();
    placeToolbarRects(rs.length ? rs : [sp.getBoundingClientRect()]);
  }
  function openHlToolbar(qid, id, sp) {
    var h = findHl(qid, id); if (!h) return;
    A.hlActive = { qid: qid, id: id }; A.hlPending = null;
    $('#hl-del').classList.remove('hidden');
    markToolbar(h);
    var n = $('#hl-note'); n.value = h.note || ''; n.classList.toggle('hidden', !h.note);
    placeToolbar(sp);
  }
  function hideHlToolbar() { $('#hl-toolbar').classList.remove('on'); A.hlActive = null; A.hlPending = null; }

  /* ================= boot ================= */
  function boot() {
    if (typeof google === 'undefined' || !google.script) { $('#login-err').textContent = 'Open this app from its web-app link.'; return; }
    A.api = { autosave: autosave, persist: persist }; // used by the local test harness only
    initNav(); initTools(); initReview(); initTeacher(); initLogin();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
