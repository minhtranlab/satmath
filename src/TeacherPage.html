<script>
/* ======================= SAT Math Lib — teacher page (spec v1.1 §2.2, §7–§9) =======================
 * Classes (start) · class screen (What to go over · Grid · Assignments) · question panel (correct answer, tries, mistake type,
 * asks) · student profile · Asked inbox · assignment builder. Short codes (E326) big with a copy button; search accepts a code.
 * Server: teacherHome, createStudent, editStudent, saveClass, classView, questionPanel, tagMistake, resolveAsk, asksInbox,
 * studentProfile, assignmentTree, pickAssignment, publishAssignment, closeAssignment, teacherResult (Teacher.gs / Code.gs).
 */
(function () {
  'use strict';
  var X, A, $, $$, el, esc, call, toast;
  var T = { home: null, view: null, cv: null, filter: '', tab: 'go', gridF: '' };

  function body() { return $('#t-body'); }
  function spin(msg) { body().innerHTML = '<div class="spinner"></div>' + (msg ? '<p class="muted t-wait">' + esc(msg) + '</p>' : ''); }

  /* ---- speed (#42): every screen is cached on this page. A screen seen before shows at once (no server wait), then refreshes
     quietly in the background; screens you are likely to open next are fetched ahead (prefetch). Changes go through the
     write queue (X.enqueue): on screen at once, saved in the background. ---- */
  var C = {}, NAV = 0, PF = [], pfBusy = false;
  function cget(k) { return C[k] ? C[k].d : null; }
  function cput(k, d) { C[k] = { d: d, at: Date.now() }; }
  function stale(re) { Object.keys(C).forEach(function (k) { if (re.test(k)) C[k].at = 0; }); }
  function busyTyping() { var a = document.activeElement; return !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && body().contains(a)); }
  function load(key, fn, args, render, msg) {
    var nav = ++NAV, have = C[key];
    if (have) render(have.d, false); else spin(msg);
    var w0 = X.WQ.seq;                                                // a change saved meanwhile → this answer may be older than it
    var p = call.apply(null, [fn, A.code].concat(args)).then(function (r) {
      if (have && (X.WQ.seq !== w0 || X.WQ.list.length)) return have.d;
      var same = have && JSON.stringify(have.d) === JSON.stringify(r);
      cput(key, r);
      if (nav === NAV && (!have || !same) && !busyTyping()) { var y = window.scrollY; render(r, true); window.scrollTo(0, y); }
      return r;
    });
    if (have) { p.catch(function () {}); return Promise.resolve(have.d); }
    return p.catch(function (e) { if (nav === NAV) fail(e); throw e; });
  }
  function prefetch(key, fn, args) {
    if (C[key] || PF.some(function (x) { return x.key === key; })) return;
    PF.push({ key: key, fn: fn, args: args }); pfPump();
  }
  function pfPump() {
    if (pfBusy || !PF.length) return;
    var j = PF.shift(); if (C[j.key]) { pfPump(); return; }
    pfBusy = true;
    call.apply(null, [j.fn, A.code].concat(j.args)).then(function (r) { if (!C[j.key]) cput(j.key, r); }).catch(function () {})
      .then(function () { pfBusy = false; setTimeout(pfPump, 30); });
  }
  /** After a save: the screens it touched refresh quietly once nothing is waiting to be saved. */
  function refreshLater(re) { stale(re); X.whenSaved(function () { if (T.view === 'home') showHome(); else if (T.view === 'class' && T.target) openClass(T.target, T.scopeArg, true); else if (T.view === 'profile' && T.pcode) openProfile(T.pcode); }); }
  function save(job) { job.args = [A.code].concat(job.args || []); return X.enqueue(job); }
  function fail(e) { body().innerHTML = '<div class="empty">' + esc(X.errMsg(e)) + '</div>'; }
  function dotHtml(c) { return '<i class="sm-dot ' + (c || 'n') + '"></i>'; }
  function diffName(d) { return { E: 'Easy', M: 'Medium', H: 'Hard' }[d] || d; }

  /** Copy a short code: clipboard API, else a hidden text box + execCommand (the Apps Script frame may refuse the API). */
  function copyText(t, btn) {
    var done = function () { toast('Copied ' + t, 1500); if (btn) { btn.classList.add('ok'); setTimeout(function () { btn.classList.remove('ok'); }, 1200); } };
    var fallback = function () {
      var ta = el('textarea', { class: 't-copybuf', readonly: 'readonly' }); ta.value = t; document.body.appendChild(ta);
      ta.select(); var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta); if (ok) done(); else toast('Select the code and copy it: ' + t, 3000);
    };
    try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(t).then(done, fallback); return; } } catch (e) {}
    fallback();
  }
  function codeHtml(code, cb, big) {
    if (!code) return '<span class="t-code none">—</span>';
    return '<span class="t-codebox' + (big ? ' big' : '') + '"><b class="t-code">' + esc(code) + '</b><button type="button" class="t-copy" data-copy="' + esc(code) + '" title="Copy ' + esc(code) + '">Copy</button>' +
      (cb ? '<span class="t-cb">CB ' + esc(cb) + '</span>' : '') + '</span>';
  }
  function bindCopies(root) { $$('[data-copy]', root).forEach(function (b) { b.onclick = function (ev) { ev.stopPropagation(); copyText(b.getAttribute('data-copy'), b); }; }); }

  /** A dialog with form fields; resolves with the button value, read() gives the field values before it closes. */
  function dialog(title, html, buttons, onOpen) {
    return new Promise(function (resolve) {
      var root = $('#modal-root'); root.innerHTML = '';
      var m = el('div', { class: 'modal t-modal', role: 'dialog' }, '<h3>' + esc(title) + '</h3><div class="body">' + html + '</div>');
      var b = el('div', { class: 'btns' });
      buttons.forEach(function (bt) {
        var x = el('button', { class: bt.cls || 'btn-blue', type: 'button' }, esc(bt.label));
        x.onclick = function () {
          var vals = {}; $$('[name]', m).forEach(function (f) { vals[f.name] = f.type === 'checkbox' ? (vals[f.name] || []).concat(f.checked ? [f.value] : []) : f.value; });
          if (bt.check && !bt.check(vals)) return;
          root.classList.remove('on'); root.innerHTML = ''; resolve({ v: bt.value, vals: vals });
        };
        b.appendChild(x);
      });
      m.appendChild(b); root.appendChild(m); root.classList.add('on');
      if (onOpen) onOpen(m);
    });
  }

  /* ================= classes (start screen) ================= */
  function showHome() {
    T.view = 'home'; X.nav('t-home'); closePanel(); T.backing = false; T.hist = [{ go: showHome }];
    return load('home', 'teacherHome', [], renderHome, 'Loading your classes…');
  }
  function renderHome(r) {
    T.home = r; $('#t-asks-n').textContent = r.open_asks ? '(' + r.open_asks + ')' : '';
    var arch = r.classes.filter(function (c) { return !c.active; }), off = r.students.filter(function (s) { return !s.active; });
    var h = '<div class="t-head"><h1>Classes</h1><div class="t-actions"><button class="btn-outline" type="button" id="t-new-st">New student</button><button class="btn-blue" type="button" id="t-new-cl">New class</button></div></div>';
    h += '<div class="t-cards">' + r.classes.filter(function (c) { return c.active || T.showArch; }).map(function (c) {
      return '<button type="button" class="t-card' + (c.active ? '' : ' arch') + (c.saving ? ' t-fresh' : '') + '" data-class="' + esc(c.class_id) + '"><b>' + esc(c.name) + (c.active ? '' : ' <span class="t-archtag">Archived</span>') + '</b><span class="t-mem">' + c.members.map(function (m) { return esc(m.name); }).join(', ') + '</span>' +
        '<span class="t-meta">' + (c.saving ? 'Saving…' : (c.last ? 'Last activity ' + esc(c.last) : 'No activity yet') + (c.asks ? ' · <b class="t-red">' + c.asks + ' asked</b>' : '') + (c.open_assignments ? ' · ' + c.open_assignments + ' assignment(s) open' : '')) + '</span></button>';
    }).join('') + '<button type="button" class="t-card all" data-class="all"><b>All students</b><span class="t-mem">' + r.students.filter(function (s) { return s.active; }).length + ' active students</span><span class="t-meta">Everything they did</span></button></div>';
    if (arch.length) h += '<p class="t-toggle"><label><input type="checkbox" id="t-show-arch"' + (T.showArch ? ' checked' : '') + '> Show archived classes (' + arch.length + ')</label></p>';
    h += '<div class="t-head t-head2"><h2 class="t-h2">Students</h2>' + (off.length ? '<label class="t-toggle"><input type="checkbox" id="t-show-off"' + (T.showOff ? ' checked' : '') + '> Show inactive (' + off.length + ')</label>' : '') + '</div>' +
      '<table class="t-table" id="t-students"><tr><th>Name</th><th>Code</th><th>Classes</th><th>Last activity</th><th>Asked</th><th>Review</th><th></th></tr>' +
      r.students.filter(function (s) { return s.active || T.showOff; }).map(function (s) {
        return '<tr class="' + (s.active ? '' : 'off') + '"><td><button type="button" class="hz-link" data-prof="' + esc(s.code) + '">' + esc(s.name) + '</button>' + (s.active ? '' : ' <span class="muted">(off)</span>') + '</td>' +
          '<td>' + codeHtml(s.code) + '</td><td>' + esc(s.classes) + '</td><td class="muted">' + esc(s.last) + '</td><td>' + (s.asks ? '<b class="t-red">' + s.asks + '</b>' : '') + '</td><td>' + (s.review || '') + '</td>' +
          '<td><button type="button" class="hz-link" data-go-st="' + esc(s.code) + '">What to go over</button></td></tr>';
      }).join('') + '</table>';
    body().innerHTML = h;
    bindCopies(body());
    $$('[data-class]', body()).forEach(function (b) { b.onclick = function () { if (b.classList.contains('t-fresh')) return; T.tab = 'go'; T.filter = ''; openClass(b.getAttribute('data-class')); }; });
    $$('[data-prof]', body()).forEach(function (b) { b.onclick = function () { openProfile(b.getAttribute('data-prof')); }; });
    $$('[data-go-st]', body()).forEach(function (b) { b.onclick = function () { T.tab = 'go'; T.filter = ''; openClass('st:' + b.getAttribute('data-go-st'), 'all'); }; });
    var sa = $('#t-show-arch'); if (sa) sa.onchange = function () { T.showArch = sa.checked; renderHome(T.home); };
    var so = $('#t-show-off'); if (so) so.onchange = function () { T.showOff = so.checked; renderHome(T.home); };
    $('#t-new-st').onclick = newStudent; $('#t-new-cl').onclick = function () { editClass(null); };
    // fetched ahead: the class screens and the Asked inbox
    r.classes.filter(function (c) { return c.active && !c.saving; }).forEach(function (c) { prefetch('cv|' + c.class_id + '|', 'classView', [c.class_id, '']); });
    prefetch('asks', 'asksInbox', []);
  }
  function newStudent() {
    var cls = (T.home && T.home.classes) || [];
    dialog('New student', '<label class="t-lab">Name<input class="field" name="name" maxlength="60" placeholder="e.g. Nguyễn An"></label>' +
      (cls.length ? '<p class="t-lab">Classes</p><div class="t-checks">' + cls.map(function (c) { return '<label><input type="checkbox" name="cls" value="' + esc(c.class_id) + '"> ' + esc(c.name) + '</label>'; }).join('') + '</div>' : '') +
      '<p class="muted">The app makes the sign-in code. It is shown once here (and stays in the Students tab).</p>',
      [{ label: 'Cancel', value: 0, cls: 'btn-outline' }, { label: 'Create', value: 1, check: function (v) { return !!String(v.name || '').trim(); } }],
      function (m) { var i = $('[name=name]', m); if (i) i.focus(); }).then(function (r) {
      if (!r.v) return;
      toast('Creating the student and the sign-in code…', 4000);
      call('createStudent', A.code, r.vals.name, r.vals.cls || []).then(function (x) {
        stale(/^(home|cv\|)/);
        dialog('Student created', '<p><b>' + esc(x.name) + '</b> signs in with:</p><p class="t-newcode">' + codeHtml(x.student_code, '', true) + '</p><p class="muted">Copy it now and give it to the student.</p>',
          [{ label: 'Done', value: 1 }], bindCopies).then(showHome);
      }).catch(function (e) { toast(X.errMsg(e), 3500); });
    });
  }
  function editClass(c) {
    var studs = (T.home && T.home.students) || [], mem = c ? c.members.map(function (m) { return m.code; }) : [];
    dialog(c ? 'Edit class' : 'New class', '<label class="t-lab">Class name<input class="field" name="name" maxlength="60" value="' + esc(c ? c.name : '') + '" placeholder="e.g. An 1-on-1"></label>' +
      '<p class="t-lab">Students (most classes are one student; a student can be in several classes)</p><div class="t-checks">' +
      studs.filter(function (s) { return s.active; }).map(function (s) { return '<label><input type="checkbox" name="st" value="' + esc(s.code) + '"' + (mem.indexOf(s.code) >= 0 ? ' checked' : '') + '> ' + esc(s.name) + ' <span class="muted">' + esc(s.code) + '</span></label>'; }).join('') + '</div>',
      [{ label: 'Cancel', value: 0, cls: 'btn-outline' }, { label: c ? 'Save' : 'Create class', value: 1, check: function (v) { return !!String(v.name || '').trim(); } }]).then(function (r) {
      if (!r.v) return;
      saveClassNow(c, r.vals.name, r.vals.st || [], true);
    });
  }

  /** Save a class (new, edited, archived, restored): on screen at once, saved in the background. */
  function saveClassNow(c, name, codes, active) {
    var home = T.home, names = {}; (home ? home.students : []).forEach(function (s) { names[s.code] = s.name; });
    var mem = codes.map(function (x) { return { code: x, name: names[x] || x }; });
    var before = home ? JSON.stringify(home.classes) : null, cvKey = c ? 'cv|' + c.class_id + '|' : null, cvBefore = cvKey && C[cvKey] ? JSON.stringify(C[cvKey].d) : null;
    var tmp = null;
    save({ fn: 'saveClass', args: [{ class_id: c ? c.class_id : '', name: name, student_codes: codes, active: active }], label: c ? 'Class "' + name + '"' : 'New class "' + name + '"',
      apply: function () {
        if (!home) return;
        if (c) home.classes.forEach(function (x) { if (x.class_id === c.class_id) { x.name = name; x.members = mem; x.active = active; } });
        else { tmp = { class_id: 'tmp-' + Date.now(), name: name, members: mem, active: true, saving: true, last: '', asks: 0, open_assignments: 0 }; home.classes.push(tmp); }
        if (cvKey && C[cvKey]) { C[cvKey].d.members = mem; C[cvKey].d.target.title = name; C[cvKey].d.target.active = active; }
        if (c && active) { T.tab = T.tab || 'go'; openClass(c.class_id); } else showHome();
      },
      undo: function () {
        if (home && before) home.classes = JSON.parse(before);
        if (cvKey && cvBefore && C[cvKey]) C[cvKey].d = JSON.parse(cvBefore);
        if (T.view === 'home') renderHome(T.home); else if (T.view === 'class' && T.cv) { T.cv = cget(cvKey) || T.cv; renderClass(); }
      },
      done: function (x) {
        if (tmp) tmp.class_id = x.class_id, tmp.saving = false;
        if (x.closed) toast('Archived. ' + x.closed + ' open assignment(s) closed.', 2500);
        refreshLater(/^(home|cv\||tree\|)/);
      } });
  }
  function archiveClass(c, on) {
    var go = function () { saveClassNow(c, c.name, c.members.map(function (m) { return m.code; }), !on); if (on) toast('Archived "' + c.name + '". Its students, sets and history stay.', 2500); };
    if (!on) { go(); return; }
    dialog('Archive "' + c.name + '"?', '<p>The class leaves the Classes screen. Its students, sets and history stay in the Sheet; open assignments of this class are closed.</p><p class="muted">You can bring it back with "Show archived classes" → Restore.</p>',
      [{ label: 'Cancel', value: 0, cls: 'btn-outline' }, { label: 'Archive class', value: 1 }]).then(function (r) { if (r.v) go(); });
  }

  /* ================= class screen ================= */
  function openClass(target, scope, quiet) {
    if (!quiet) track(function () { openClass(target, scope); }, '', 'cl|' + target + '|' + (scope || ''));
    T.view = 'class'; X.nav('t-class'); T.target = target; T.scopeArg = scope || ''; if (!quiet) closePanel();
    var key = 'cv|' + target + '|' + (scope || '');
    return load(key, 'classView', [target, scope || ''], function (r) {
      T.cv = r; renderClass();
      r.members.forEach(function (m) { prefetch('prof|' + m.code, 'studentProfile', [m.code]); });   // the profiles of this class, fetched ahead
    }, 'Loading the class…');
  }
  function renderClass() {
    var r = T.cv, isCls = r.target.kind === 'class';
    var h = '<button type="button" class="hz-link t-back" id="t-back">← Classes</button><div class="t-head"><div><h1>' + esc(r.target.title) + '</h1>' +
      '<div class="t-chips">' + r.members.map(function (m) { return '<button type="button" class="t-chip" data-prof="' + esc(m.code) + '">' + esc(m.name) + '</button>'; }).join('') + '</div></div>' +
      '<div class="t-actions">' + (isCls ? (clsRow() && !clsRow().active ? '<button class="btn-blue" type="button" id="t-restore-cl">Restore class</button>' : '<button class="btn-outline" type="button" id="t-arch-cl">Archive class</button><button class="btn-outline" type="button" id="t-edit-cl">Edit class</button>') : '') +
      (r.target.kind !== 'all' ? '<button class="btn-blue" type="button" id="t-new-asg">New assignment</button>' : '') + '</div></div>';
    h += '<div class="t-bar"><label>Look at <select id="t-scope" class="field">' + r.scopes.map(function (s) { return '<option value="' + esc(s.id) + '"' + (s.id === r.scope ? ' selected' : '') + '>' + esc(s.label) + '</option>'; }).join('') + '</select></label>' +
      '<input id="t-search" class="field" placeholder="Find a question: E326, M12, CB id…" autocomplete="off" value="' + esc(T.filter) + '"></div>';
    h += '<div class="t-tabs" role="tablist">' + [['go', 'What to go over'], ['grid', 'Grid'], ['asg', 'Assignments (' + r.assignments.length + ')']].map(function (t) {
      return '<button type="button" role="tab" data-tab="' + t[0] + '" class="' + (T.tab === t[0] ? 'on' : '') + '">' + t[1] + '</button>'; }).join('') + '</div><div id="t-tabbody"></div>';
    body().innerHTML = h;
    $('#t-back').onclick = showHome;
    $$('[data-prof]', body()).forEach(function (b) { b.onclick = function () { openProfile(b.getAttribute('data-prof')); }; });
    var cr = function () { return clsRow() || { class_id: r.target.id, name: r.target.title, members: r.members, active: true }; };
    var ec = $('#t-edit-cl'); if (ec) ec.onclick = function () { editClass(cr()); };
    var ac = $('#t-arch-cl'); if (ac) ac.onclick = function () { archiveClass(cr(), true); };
    var rc = $('#t-restore-cl'); if (rc) rc.onclick = function () { archiveClass(cr(), false); };
    var na = $('#t-new-asg'); if (na) na.onclick = function () { openBuilder(r.target.kind === 'student' ? 'st:' + r.target.id : r.target.id); };
    $('#t-scope').onchange = function () { openClass(T.target, this.value, true); };
    var si = $('#t-search');
    si.oninput = function () { T.filter = si.value.trim(); renderTab(); };
    si.onkeydown = function (e) {
      if (e.key !== 'Enter' || !si.value.trim()) return;
      var hit = filtered()[0];
      if (hit) goList(filtered(), hit.qid); else openGo([si.value.trim()], si.value.trim(), { back: 'Back to class' }); // not in this list: from the library by its code
    };
    $$('[data-tab]', body()).forEach(function (b) { b.onclick = function () { T.tab = b.getAttribute('data-tab'); $$('[data-tab]', body()).forEach(function (x) { x.classList.toggle('on', x === b); }); renderTab(); }; });
    renderTab();
  }
  function clsRow() { var r = T.cv; return r && T.home ? (T.home.classes || []).filter(function (c) { return c.class_id === r.target.id; })[0] : null; }
  function filtered() {
    var f = T.filter.toUpperCase();
    return T.cv.rows.filter(function (q) { return !f || [q.code, q.qid, q.cb_id].some(function (x) { return String(x || '').toUpperCase().indexOf(f) >= 0; }); });
  }
  var GROUPS = { 1: 'Wrong on the first try', 2: 'Right on the first try, but asked', 3: 'Right, but slow', 4: 'Right, fast, nobody asked' };
  function renderTab() {
    var tb = $('#t-tabbody'), r = T.cv;
    if (T.tab === 'asg') { tb.innerHTML = asgListHtml(r.assignments); bindAsg(tb); return; }
    var rows = filtered();
    if (!rows.length) { tb.innerHTML = '<div class="empty">' + (T.filter ? 'No question "' + esc(T.filter) + '" in this list. Press Enter to open it from the library.' : 'Nothing done in this period yet. Pick another period above.') + '</div>'; return; }
    if (T.tab === 'grid') { renderGrid(tb, rows); return; }
    var h = '';
    if (r.weak && r.weak.length) h += '<p class="t-weak">Weak sub-skills: ' + r.weak.map(function (w) { return '<span>' + dotHtml('r') + esc(w.name) + ' · ' + w.right + '/' + w.n + ' first try</span>'; }).join('') + '</p>';
    var g = 0;
    rows.forEach(function (q, i) {
      if (q.group !== g) {
        if (g === 4) h += '</details>';
        g = q.group;
        var n = rows.filter(function (x) { return x.group === g; }).length;
        h += g === 4 ? '<details class="t-fold"><summary>' + GROUPS[g] + ' (' + n + ')</summary>' : '<h3 class="t-grp">' + GROUPS[g] + ' <span class="muted">' + n + '</span></h3>';
      }
      h += '<div class="t-row" data-q="' + esc(q.qid) + '" tabindex="0"><div class="t-rc">' + codeHtml(q.code, q.cb_id, true) + '</div>' +
        '<div class="t-rm"><b>' + esc(q.subskill_name || q.skill_name) + '</b><span class="muted"> · ' + diffName(q.difficulty) + '</span><div class="t-sum">' + esc(q.summary) +
        (q.untagged ? ' · <span class="t-untag">' + q.untagged + ' untagged</span>' : '') + '</div></div>' +
        '<div class="t-rs">' + q.students.map(function (s) {
          return '<span class="t-mini ' + (s.right1 ? 'right' : s.best ? 'fixed' : 'wrong') + '" title="' + esc(s.name) + '">' + esc(s.name.split(/\s+/)[0]) + (s.asked && s.ask_status === 'open' ? ' ?' : '') + (s.badge ? ' ' + s.badge : '') + '</span>';
        }).join('') + '</div></div>';
    });
    if (g === 4) h += '</details>';
    tb.innerHTML = h;
    bindCopies(tb);
    $$('.t-row', tb).forEach(function (row) {
      row.onclick = function () { goList(rows, row.getAttribute('data-q')); };
      row.onkeydown = function (e) { if (e.key === 'Enter') goList(rows, row.getAttribute('data-q')); };
    });
  }
  var GRID_F = [['', 'All'], ['wrong', 'Wrong'], ['slow', 'Slow'], ['rushed', 'Rushed'], ['asked', 'Asked'], ['untagged', 'Untagged'], ['tries', 'Many tries']];
  function gridKeep(s) {
    switch (T.gridF) {
      case 'wrong': return !s.right1; case 'slow': return /SLOW/.test(s.profile); case 'rushed': return s.profile === 'FAST_WRONG';
      case 'asked': return s.asked && s.ask_status === 'open'; case 'untagged': return !s.right1 && !s.mistake_type; case 'tries': return s.n_tries >= 2;
      default: return true;
    }
  }
  function renderGrid(tb, rows) {
    var mem = T.cv.members;
    var keepRows = rows.filter(function (q) { return q.students.some(gridKeep); });

        '<div class="t-head"><div><h1>Placement test — ' + esc(r.student) + '</h1><div class="muted">Form ' + esc(r.form) + ' · ' + esc(r.date) + ' · ' + r.n_items + ' questions · ' + r.n_right + ' right · ' + r.time_min + ' min' + (r.done ? '' : ' · <b>not finished</b>') + '</div></div>' +
        '<div class="t-actions"><button class="btn-outline" type="button" id="pl-prof">Profile</button></div></div>';
      if (r.pace) h += '<p class="t-pace" id="pl-pace">' + (r.pace.has_answer_time ? 'Answering <b>' + r.pace.answer_min + ' min</b> · ' : '') + X.awayLine(r.pace.away_n, r.pace.away_sec, r.pace.away_at) +
        (r.items.some(function (x) { return x.away_flag; }) ? ' · <span class="t-warn">⚠ = left the window ≥ ' + r.away_flag_sec + ' s on that question, then right (a sign, not proof)</span>' : '') + '</p>';
      h += '<div class="pl-tdoms" id="pl-tdoms">' + r.domains.map(function (d) {
        var pv = r.previous ? r.previous.domains.filter(function (x) { return x.dom === d.dom; })[0] : null;
        return '<div class="pl-tdom"><div class="muted">' + esc(d.name) + '</div><div>' + plLvl(d.level) + (pv && pv.level ? ' <span class="muted">(before: ' + esc(PL_WORD[pv.level] || pv.level) + (pv.level === '<E' ? ', below Easy' : '') + ')</span>' : '') + '</div>' +
          '<div class="muted pl-path">' + (d.n ? d.right + '/' + d.n + ' · ' + esc(d.path) : 'not tested') + '</div><div class="pl-start">Practice starts: <b>' + esc(d.level ? lvName(d.level) : '—') + '</b></div></div>';
      }).join('') + '</div>';
      h += '<h2 class="t-h2">Teach first</h2>' + (r.teach_first.length ? '<ol class="pl-teach" id="pl-teach">' + r.teach_first.map(function (k) { return '<li><b>' + esc(k.name) + '</b> <span class="muted">' + esc(PL_SHORT[k.dom]) + ' · ' + k.right + '/' + k.n + ' right</span> ' + plLvl(k.level) + '</li>'; }).join('') + '</ol>'
        : '<p class="muted">Nothing below Strong among the skills tested.</p>');
      if (r.done) h += recBox(r.student_code, { topics: r.teach_first.map(function (k) { return { code: k.skill, name: k.name, level: k.level, n: 4, diffs: diffsFor(k.level) }; }), review: 0 });
      h += '<h2 class="t-h2">Skills tested</h2><table class="t-table"><tr><th>Skill</th><th>Area</th><th>Right</th><th>Level now</th>' + (r.previous ? '<th>Before</th>' : '') + '</tr>' + r.skills.map(function (k) {
        return '<tr><td>' + esc(k.name) + '</td><td class="muted">' + esc(PL_SHORT[k.dom]) + '</td><td>' + k.right + '/' + k.n + '</td><td>' + plLvl(k.level) + '</td>' + (r.previous ? '<td>' + plLvl(r.previous.skills[k.skill] || '') + '</td>' : '') + '</tr>';
      }).join('') + '</table>';
      if (r.previous) h += '<p class="t-line muted">Compared with the placement of ' + esc(r.previous.date) + ' (form ' + esc(r.previous.form) + ', ' + r.previous.n_items + ' questions).</p>';
      h += '<h2 class="t-h2">Questions in order</h2><table class="t-table pl-items" id="pl-items"><tr><th>#</th><th>Question</th><th>Area · slot</th><th>Sub-skill</th><th>Answer</th><th>Time</th></tr>' + r.items.map(function (x) {
        return '<tr data-q="' + esc(x.qid) + '" tabindex="0"><td class="muted">' + x.no + '</td><td>' + codeHtml(x.code) + '</td><td>' + esc(PL_SHORT[x.dom] || x.dom) + ' · <b>' + esc(x.slot) + '</b></td><td class="muted">' + esc(x.subskill_name) + '</td>' +
          '<td><span class="t-mini ' + (x.right ? 'right' : '') + '">' + (x.blank ? 'blank' : esc(x.answer)) + ' ' + (x.right ? '✓' : '✗') + '</span></td>' +
          '<td>' + x.time_s + ' s <span class="pl-band ' + esc(x.band) + '">' + esc(x.band) + '</span>' + (x.away_sec ? ' <span class="t-awayq' + (x.away_flag ? ' flag' : '') + '" title="Left the window on this question">' + (x.away_flag ? '⚠ ' : '') + 'left ' + X.durStr(x.away_sec) + '</span>' : '') + '</td></tr>';
      }).join('') + '</table>';
      var b = r.bands || {};
      h += '<p class="t-line muted">Time bands (Settings): Easy fast ≤ ' + (b.E || [])[0] + ' s, normal ≤ ' + (b.E || [])[1] + ' s · Medium ≤ ' + (b.M || [])[0] + ' / ' + (b.M || [])[1] + ' s · Hard ≤ ' + (b.H || [])[0] + ' / ' + (b.H || [])[1] + ' s (Hard: time recorded only) · grid-in + ' + b.spr + ' s. A slow right answer counts half a step.</p>';
      body().innerHTML = h; bindCopies(body());
      $('#t-back').onclick = function () { if (back) openProfile(back); else showHome(); };
      $('#pl-prof').onclick = function () { openProfile(r.student_code); };
      recBind(r.student_code, { review: 0 });
      // #50: the placement questions in order on the test screen; the student's answer + time as the side info
      var plRows = plSide(r);
      $$('#pl-items tr[data-q]').forEach(function (tr) { tr.onclick = function () {
        openGo(r.items.map(function (x) { return x.qid; }), tr.getAttribute('data-q'), { back: 'Back to report', who: r.student || '', side: { rows: function () { return Promise.resolve(plRows); }, drawer: plDrawer } });
      }; });
    }
  }

  /* ================= entry ================= */
  function init() {
    X = window.SMLX; A = X.A; $ = X.$; $$ = X.$$; el = X.el; esc = X.esc; call = X.call; toast = X.toast;
    $$('.t-nav [data-go]').forEach(function (b) { b.onclick = function () { var g = b.getAttribute('data-go'); if (g === 'home') showHome(); else if (g === 'asks') showAsks(); else openBuilder(''); }; });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePanel(); });
  }
  window.SMLT = { side: side, levelChanged: function () { stale(/^(cv\||go\||prof\||tree\||home)/); }, back: function () { if (!T.hist || T.hist.length < 2) return false; T.hist.pop(); T.backing = true; T.hist[T.hist.length - 1].go(); return true; }, init: init, openPlacement: function (id) { openPlacement(id); }, show: function () { X.nav('t-' + (T.view || 'home')); if (T.view === 'class' && T.cv) renderClass(); else if (T.view === 'profile' && T.pcode) openProfile(T.pcode); else showHome(); } };
  if (window.SMLX) init();
})();
</script>
